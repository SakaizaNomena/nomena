<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portfolio de Nomena Sahaza — Développeur Full-stack (React, Next.js, TypeScript, Python).">
  <meta name="theme-color" id="theme-color-meta" content="#f2f0ec">
  <title>Nomena Sahaza — Développeur Full-stack</title>
  <script>
    // Applique le thème avant le premier rendu (évite tout flash).
    (function () {
      var stored = null;
      try { stored = localStorage.getItem("pf-theme"); } catch (e) {}
      var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      document.documentElement.style.colorScheme = dark ? "dark" : "light";
    })();
  </script>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="blob blob--violet"></span>
    <span class="blob blob--peach"></span>
    <span class="blob blob--mint"></span>
    <span class="blob blob--blue"></span>
  </div>
  <div class="grain" aria-hidden="true"></div>
  <div class="cursor-glow" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#hero" aria-label="Retour en haut">
      <span class="brand__mark">NS</span>
      <span class="brand__text">
        <strong>Nomena Sahaza</strong>
        <small>Développeur Full-stack</small>
      </span>
    </a>
    <div class="topbar__right">
      <span class="status"><i></i>Disponible pour des missions freelance, CDD, CDI</span>
      <a class="btn btn--ghost btn--sm" id="cv-link" href="#" download>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4.5-4.5M12 15l-4.5-4.5M4 20h16"/></svg>
        CV
      </a>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Activer le mode sombre" aria-pressed="false" title="Mode sombre">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.2 8.2 0 0 1 9.5 4a8.3 8.3 0 1 0 10.5 10.5Z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.2 4.2l1.4 1.4m12.8 12.8 1.4 1.4M2 12h2m16 0h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section id="hero" class="hero" aria-label="Présentation"></section>
    <section id="about" class="section" aria-label="À propos"></section>
    <section id="skills" class="section" aria-label="Compétences"></section>
    <section id="projects" class="section" aria-label="Projets"></section>
    <section id="journey" class="section" aria-label="Parcours"></section>
    <section id="contact" class="section" aria-label="Contact"></section>
  </main>

  <footer class="footer">
    <p id="footer-text"></p>
    <a href="#hero" class="footer__top">Revenir en haut ↑</a>
  </footer>

  <nav class="dock" aria-label="Navigation principale"></nav>

  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet__backdrop" data-close></div>
    <article class="sheet__panel" id="sheet-panel"></article>
  </div>

  <noscript>
    <p style="padding:2rem;text-align:center">Ce portfolio a besoin de JavaScript pour afficher son contenu.</p>
  </noscript>

  <script src="./data.js"></script>
  <script src="./script.js"></script>
</body>
</html>
